# Inactivo hasta que un operador habilite el repositorio y configure producción.
name: Migraciones de Supabase en producción

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: supabase-migraciones-produccion
  cancel-in-progress: false

jobs:
  migraciones:
    if: vars.SUPABASE_MIGRACIONES_HABILITADAS == 'true'
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - name: Obtener el código integrado
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Configurar Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.14.0'
      - name: Verificar historial y corte aprobado
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          CORTE_APROBADO: ${{ vars.SUPABASE_CORTE_APROBADO }}
        run: bash scripts/produccion/verificar-migraciones.sh
      - name: Mostrar el plan sin aplicar
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: npx --yes supabase@2.121.0 db push --db-url "$SUPABASE_DB_URL" --skip-vault --dry-run
      - name: Aplicar migraciones pendientes
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: npx --yes supabase@2.121.0 db push --db-url "$SUPABASE_DB_URL" --skip-vault --yes
