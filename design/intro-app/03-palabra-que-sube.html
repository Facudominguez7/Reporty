<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>03 — Palabra que sube</title>
<style>
  *{box-sizing:border-box;margin:0}
  html,body{height:100%}
  body{font-family:system-ui,sans-serif;width:412px;height:917px;overflow:hidden;background:#f2f0ef;position:relative}
  /* ---- Capa final: mapa ---- */
  .final{position:absolute;inset:0;background:#f2f0ef}
  .final svg{width:100%;height:100%;display:block}
  /* ---- Intro ---- */
  .intro{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:linear-gradient(rgb(255 255 255/.3),rgb(255 255 255/.55)),#f2f0ef;
    animation:salida .8s cubic-bezier(.65,0,.35,1) 2.05s 1 both}
  .letras{display:flex;font-size:3.4rem;font-weight:700;letter-spacing:-.04em;color:#2b2a26}
  .letras span{display:inline-block;animation:subir .55s cubic-bezier(.22,1,.36,1) both}
  .letras span:nth-child(1){animation-delay:.1s}.letras span:nth-child(2){animation-delay:.16s}
  .letras span:nth-child(3){animation-delay:.22s}.letras span:nth-child(4){animation-delay:.28s}
  .letras span:nth-child(5){animation-delay:.34s}.letras span:nth-child(6){animation-delay:.4s}
  .letras span:nth-child(7){animation-delay:.46s}.letras span:nth-child(8){animation-delay:.52s}
  .subrayado{width:168px;height:7px;border-radius:999px;background:#2e7d5b;margin-top:14px;
    transform-origin:left center;animation:trazo .5s cubic-bezier(.22,1,.36,1) .8s both}
  .lema{margin-top:18px;color:#57736a;font-size:.95rem;animation:subir .6s cubic-bezier(.22,1,.36,1) 1s both}
  .icono{width:64px;height:64px;border-radius:20px;background:#2e7d5b;display:flex;align-items:center;justify-content:center;
    margin-bottom:26px;animation:subir .6s cubic-bezier(.22,1,.36,1) .05s both}
  @keyframes subir{from{opacity:0;transform:translateY(1.25rem) scale(.985)}to{opacity:1;transform:translateY(0) scale(1)}}
  @keyframes trazo{from{transform:scaleX(0)}to{transform:scaleX(1)}}
  @keyframes salida{to{opacity:0;transform:translateY(-6%) scale(1.02)}}
  @media (prefers-reduced-motion: reduce){
    .intro{display:none}
  }
  .replay{position:absolute;right:12px;bottom:88px;z-index:9;background:rgb(43 42 38/.12);color:#2b2a26;border:1px solid rgb(43 42 38/.3);
    border-radius:999px;padding:8px 14px;font:inherit;font-size:.8rem;cursor:pointer}
</style>
</head>
<body>
  <div class="final" aria-hidden="true">
    <svg viewBox="0 0 412 917" preserveAspectRatio="xMidYMid slice" role="presentation">
      <rect width="412" height="917" fill="#e9f0e4"/>
      <path d="M0 300 Q120 250 200 300 T412 280 V917 H0 Z" fill="#bfe0ea" opacity=".85"/>
      <g stroke="#dcd8cf" stroke-width="5" fill="none" opacity=".9">
        <path d="M20 420 H380"/><path d="M60 500 H350"/><path d="M110 580 H390"/>
        <path d="M140 380 L120 700"/><path d="M250 360 L270 720"/>
      </g>
      <g fill="#7fbf9f"><circle cx="90" cy="470" r="9"/><circle cx="205" cy="520" r="11"/><circle cx="300" cy="450" r="8"/></g>
    </svg>
  </div>

  <div class="intro" id="intro" role="img" aria-label="Entrada de Reporty: el nombre aparece letra por letra con subrayado verde y se funde hacia el mapa">
    <span class="icono" aria-hidden="true"><svg width="36" height="36" viewBox="0 0 24 24"><path d="M12 22s8-6.9 8-12.2A8 8 0 1 0 4 9.8C4 15.1 12 22 12 22Z" fill="#fff"/><circle cx="12" cy="9.4" r="3.1" fill="#2e7d5b"/></svg></span>
    <p class="letras" id="letras"><span>R</span><span>e</span><span>p</span><span>o</span><span>r</span><span>t</span><span>y</span></p>
    <span class="subrayado" id="subrayado"></span>
    <p class="lema">Tu ciudad, reportada y reparada</p>
  </div>

  <button class="replay" onclick="repetir()">Repetir animación</button>
<script>
  function repetir(){
    document.querySelectorAll('#intro, #intro span, #intro p, #intro .subrayado').forEach(el=>{
      el.style.animation='none';void el.offsetWidth;el.style.animation='';
    });
  }
</script>
</body>
</html>
