allowBuilds:
  '@tailwindcss/oxide': true
  esbuild: true
  unrs-resolver: true
  workerd: true
overrides:
  "@typescript-eslint/typescript-estree>minimatch": 11.0.1
  # Alertas de Dependabot 1-3: @opennextjs/cloudflare y @node-minify/core (sólo
  # herramientas de build) traen glob 10/13 y minimatch 9/10 vulnerables, y sus
  # últimas versiones no los actualizan. glob 14 mantiene `glob` y `globSync`.
  "glob@>=9.0.0 <14.0.2": ^14.0.4
  "minimatch@>=7.0.0 <11.0.1": ^11.0.5
